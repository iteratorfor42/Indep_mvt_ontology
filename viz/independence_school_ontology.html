<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>일제강점기 독립운동-근대학교 온톨로지</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<style>
  :root {
    --paper: #F3EDE0;
    --paper-2: #EAE2D0;
    --ink: #2B2620;
    --ink-soft: #5A5348;
    --hairline: #C9BFA8;
    --red: #A8342A;
    --school: #2C3E66;
    --org: #7A6A35;
    --event: #3D6B5C;
    --place: #8B857A;
    --collab: #8C2F26;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'IBM Plex Mono', monospace;
  }
  header {
    padding: 28px 32px 18px;
    border-bottom: 1px solid var(--hairline);
  }
  h1 {
    font-family: 'Noto Serif KR', serif;
    font-weight: 700;
    font-size: 26px;
    margin: 0 0 6px;
    letter-spacing: -0.3px;
  }
  .subtitle {
    font-size: 13px;
    color: var(--ink-soft);
    line-height: 1.6;
  }
  .stamp {
    display: inline-block;
    border: 1.5px solid var(--red);
    color: var(--red);
    font-family: 'Noto Serif KR', serif;
    font-weight: 700;
    font-size: 11px;
    padding: 2px 8px;
    margin-right: 8px;
    letter-spacing: 1px;
    transform: rotate(-2deg);
  }
  .layout {
    display: grid;
    grid-template-columns: 1fr 300px;
    gap: 0;
  }
  #graph-wrap {
    position: relative;
    border-right: 1px solid var(--hairline);
  }
  #graph { display: block; width: 100%; }
  .controls {
    position: absolute;
    top: 14px;
    left: 14px;
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    max-width: calc(100% - 28px);
  }
  .filter-btn {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    padding: 5px 10px;
    background: var(--paper);
    border: 1px solid var(--hairline);
    color: var(--ink-soft);
    cursor: pointer;
    border-radius: 3px;
    user-select: none;
  }
  .filter-btn.active { color: #fff; border-color: transparent; }
  .filter-btn[data-type="School"].active { background: var(--school); }
  .filter-btn[data-type="Organization"].active { background: var(--org); }
  .filter-btn[data-type="Event"].active { background: var(--event); }
  .filter-btn[data-type="Person"].active { background: var(--red); }
  .filter-btn[data-type="Place"].active { background: var(--place); }
  #search {
    position: absolute;
    top: 14px;
    right: 14px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    padding: 6px 10px;
    border: 1px solid var(--hairline);
    background: #fff;
    color: var(--ink);
    width: 160px;
    border-radius: 3px;
  }
  #search::placeholder { color: #A39B8B; }
  .node circle { cursor: pointer; stroke-width: 1px; }
  .node text {
    font-family: 'Noto Serif KR', serif;
    font-size: 11px;
    fill: var(--ink);
    pointer-events: none;
  }
  .node.dim { opacity: 0.12; }
  .link { stroke: #B8AD93; stroke-width: 1px; opacity: 0.55; }
  .link.dim { opacity: 0.05; }
  .link-label {
    font-size: 9px;
    fill: var(--ink-soft);
    pointer-events: none;
  }
  #panel {
    padding: 20px 18px;
    overflow-y: auto;
    max-height: calc(100vh - 90px);
  }
  #panel h2 {
    font-family: 'Noto Serif KR', serif;
    font-size: 17px;
    margin: 0 0 4px;
  }
  #panel .type-tag {
    display: inline-block;
    font-size: 10px;
    padding: 2px 7px;
    border-radius: 3px;
    color: #fff;
    margin-bottom: 12px;
  }
  #panel .desc {
    font-size: 12.5px;
    line-height: 1.7;
    color: var(--ink-soft);
    border-top: 1px dashed var(--hairline);
    padding-top: 10px;
    margin-top: 8px;
  }
  #panel .rel-title {
    font-family: 'Noto Serif KR', serif;
    font-size: 12px;
    font-weight: 700;
    margin: 16px 0 6px;
    color: var(--red);
  }
  #panel .rel-item {
    font-size: 12px;
    padding: 5px 0;
    border-bottom: 1px solid var(--paper-2);
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    gap: 6px;
  }
  #panel .rel-item:hover { color: var(--red); }
  #panel .rel-verb { color: #A39B8B; font-size: 10px; white-space: nowrap; }
  #panel .empty {
    font-size: 12.5px;
    color: var(--ink-soft);
    line-height: 1.8;
  }
  .legend-key {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    color: var(--ink-soft);
    margin-bottom: 5px;
  }
  .legend-dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
  #legend { margin-top: 18px; padding-top: 12px; border-top: 1px solid var(--hairline); }
  @media (max-width: 760px) {
    .layout { grid-template-columns: 1fr; }
    #panel { max-height: 300px; }
  }
</style>
</head>

<header>
  <div><span class="stamp">FACT-CHECKED</span></div>

</header>

<div class="layout">

    <div id="legend">

</div>

  ["이동녕","신흥무관학교","설립"],["이동녕","대한민국임시정부","소속"],
  ["이상룡","신흥무관학교","설립"],["이상룡","양기탁","영향받음"],
  ["지청천","신흥무관학교","재직"],
  ["이종일","보성학교","경영"],["이종일","삼일운동","참여"],["삼일운동","보성학교","인쇄"],
  ["한용운","삼일운동","참여"],["오세창","천도교","소속"],["오세창","삼일운동","참여"],
  ["김좌진","신민회","소속"],["김좌진","북로군정서","창설"],["김좌진","청산리전투","참여"],
  ["서일","북로군정서","창설"],
  ["이범석","신흥무관학교","재직"],["이범석","북로군정서","소속"],["이범석","청산리전투","참여"],
  ["이승만","대한민국임시정부","소속"],["이동휘","대한민국임시정부","소속"],
  ["최린","천도교","소속"],["최린","삼일운동","참여"],
  ["정춘수","삼일운동","참여"],
  ["박희도","숭실학교","졸업"],["박희도","삼일운동","참여"],["박희도","신간회","소속"],
  ["오산학교","정주","위치"],["대성학교","평양","위치"],["숭실학교","평양","위치"],
  ["보성학교","서울","위치"],["신민회","평양","위치"],["조선물산장려회","평양","위치"],
  ["대한민국임시정부","상해","위치"]
];

const colorMap = { School:"#2C3E66", Organization:"#7A6A35", Event:"#3D6B5C", Place:"#8B857A", Person:"#A8342A" };
function nodeColor(d){ return d.collab ? "#8C2F26" : colorMap[d.type]; }
function nodeRadius(d){ return d.type==="Person" ? 8 : (d.type==="Place" ? 5 : 10); }

const wrap = document.getElementById('graph-wrap');
let W = wrap.clientWidth, H = window.innerHeight - 92;
const svg = d3.select("#graph").attr("width", W).attr("height", H);
const g = svg.append("g");

svg.call(d3.zoom().scaleExtent([0.3,3]).on("zoom", (ev) => g.attr("transform", ev.transform)));

const nodeById = new Map(nodesData.map(d => [d.id, d]));
const links = linksData.map(([s,t,l]) => ({source:s, target:t, label:l}));

const sim = d3.forceSimulation(nodesData)
  .force("link", d3.forceLink(links).id(d => d.id).distance(75).strength(0.5))
  .force("charge", d3.forceManyBody().strength(-190))
  .force("center", d3.forceCenter(W/2, H/2))
  .force("collide", d3.forceCollide().radius(28));

const link = g.append("g").selectAll("line").data(links).join("line").attr("class","link");

const node = g.append("g").selectAll("g").data(nodesData).join("g")
  .attr("class","node")
  .call(d3.drag()
    .on("start", (ev,d)=>{ if(!ev.active) sim.alphaTarget(0.25).restart(); d.fx=d.x; d.fy=d.y; })
    .on("drag", (ev,d)=>{ d.fx=ev.x; d.fy=ev.y; })
    .on("end", (ev,d)=>{ if(!ev.active) sim.alphaTarget(0); d.fx=null; d.fy=null; }));

node.append("circle")
  .attr("r", nodeRadius)
  .attr("fill", nodeColor)
  .attr("stroke", d => d.collab ? "#fff" : "none")
  .attr("stroke-width", d => d.collab ? 2 : 0);

node.append("text")
  .text(d => d.id)
  .attr("x", d => nodeRadius(d) + 4)
  .attr("y", 4);

node.on("click", (ev,d) => showPanel(d));

sim.on("tick", () => {
  link.attr("x1", d=>d.source.x).attr("y1", d=>d.source.y)
      .attr("x2", d=>d.target.x).attr("y2", d=>d.target.y);
  node.attr("transform", d => `translate(${d.x},${d.y})`);
});

const typeLabels = {School:"학교", Organization:"단체", Event:"사건", Person:"인물", Place:"장소"};
const filterState = new Set(Object.keys(typeLabels));
const filterBar = document.getElementById('filters');
Object.entries(typeLabels).forEach(([type,label]) => {
  const btn = document.createElement('div');
  btn.className = 'filter-btn active';
  btn.dataset.type = type;
  btn.textContent = label;
  btn.onclick = () => {
    if (filterState.has(type)) { filterState.delete(type); btn.classList.remove('active'); }
    else { filterState.add(type); btn.classList.add('active'); }
    applyFilter();
  };
  filterBar.appendChild(btn);
});

function applyFilter(query) {
  const q = (query||"").trim();
  node.classed("dim", d => !filterState.has(d.type) || (q && !d.id.includes(q)));
  link.classed("dim", l => {
    const s = nodeById.get(l.source.id||l.source), t = nodeById.get(l.target.id||l.target);
    const okType = filterState.has(s.type) && filterState.has(t.type);
    const okQuery = !q || s.id.includes(q) || t.id.includes(q);
    return !(okType && okQuery);
  });
}

document.getElementById('search').addEventListener('input', (e) => applyFilter(e.target.value));

function showPanel(d) {
  const panel = document.getElementById('panel');
  const related = links.filter(l => (l.source.id||l.source)===d.id || (l.target.id||l.target)===d.id)
    .map(l => {
      const sId = l.source.id||l.source, tId = l.target.id||l.target;
      const other = sId===d.id ? tId : sId;
      const dir = sId===d.id ? "→" : "←";
      return {other, label:l.label, dir};
    });
  panel.innerHTML = `
    <h2>${d.id}</h2>
    <span class="type-tag" style="background:${nodeColor(d)}">${typeLabels[d.type]}${d.collab?' · 친일 전향':''}</span>
    <div class="desc">${d.desc}</div>
    <div class="rel-title">연결 관계 (${related.length})</div>
    ${related.map(r => `<div class="rel-item" data-id="${r.other}"><span>${r.dir} ${r.other}</span><span class="rel-verb">${r.label}</span></div>`).join('')}
    <div id="legend">
      <div class="legend-key"><span class="legend-dot" style="background:#2C3E66"></span>학교</div>
      <div class="legend-key"><span class="legend-dot" style="background:#7A6A35"></span>단체</div>
      <div class="legend-key"><span class="legend-dot" style="background:#3D6B5C"></span>사건</div>
      <div class="legend-key"><span class="legend-dot" style="background:#A8342A"></span>인물</div>
      <div class="legend-key"><span class="legend-dot" style="background:#8B857A"></span>장소</div>
      <div class="legend-key"><span class="legend-dot" style="background:#8C2F26;border:2px solid #fff;box-shadow:0 0 0 1px #8C2F26"></span>인물 (이후 친일 전향)</div>
    </div>
  `;
  panel.querySelectorAll('.rel-item').forEach(el => {
    el.onclick = () => { const nd = nodeById.get(el.dataset.id); if (nd) showPanel(nd); };
  });
}

window.addEventListener('resize', () => {
  W = wrap.clientWidth; H = window.innerHeight - 92;
  svg.attr("width", W).attr("height", H);
  sim.force("center", d3.forceCenter(W/2, H/2));
  sim.alpha(0.3).restart();
});
</script>
</body>
</html>
